  <script>
  // ══════════════════════════════════════════════
  //  CONFIG
  // ══════════════════════════════════════════════
  const SUPABASE_URL = 'https://ckofdbjfbxoxxxtedmqa.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrb2ZkYmpmYnhveHh4dGVkbXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzQ1NzQsImV4cCI6MjA4OTQxMDU3NH0.-7xPMdRZO_VnYZF7GLOmvOOwrDJ2T2o_yWCSlcE-Kqg';

  // ══════════════════════════════════════════════
  //  LOAD SCHOOL
  // ══════════════════════════════════════════════
  var schoolData = null;

  async function loadSchool() {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    if (!slug) {
      showError('No school specified.', 'Go back to <a href="switzerland-schools.html">browse schools</a>.');
      return;
    }

    try {
      var fields = [
        'id','slug','name','country','city','region','address',
        'fees_usd_min','fees_usd_max','fees_currency','fees_original','fees_includes_boarding',
        'school_type','founded_year','student_count','nationalities_count',
        'curriculum','age_min','age_max','languages',
        'boarding','boarding_capacity','single_rooms',
        'international_student_percent','thai_students',
        'admissions_open_month','rolling_admissions','application_deadline','entrance_exam_required',
        'scholarship_available','sports_facilities','arts_programs','extracurriculars',
        'official_website','virtual_tour_url','head_of_school',
        'contact_email','contact_phone','accreditations',
        'sen_support','eal_support','description',
        'strengths','clubs','stages','house_system','governance',
        'visa_support','boarding_arrangements','boarding_facilities',
        'university_placement_rate','top_universities'
      ].join(',');

      var url = SUPABASE_URL + '/rest/v1/schools?select=' + fields + '&slug=eq.' + encodeURIComponent(slug);
      var res = await fetch(url, {
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
      });
      var data = await res.json();
      if (!data || data.length === 0) {
        showError('School not found.', 'We couldn\'t find a school with that URL. <a href="switzerland-schools.html">Browse all schools →</a>');
        return;
      }
      schoolData = data[0];
      renderPage(schoolData);
    } catch(err) {
      showError('Failed to load school.', err.message);
    }
  }

  // ══════════════════════════════════════════════
  //  RENDER PAGE
  // ══════════════════════════════════════════════
  function renderPage(s) {
    // Update title
    document.getElementById('page-title').textContent = (s.name || 'School') + ' — LINKEDU Switzerland';
    document.getElementById('page-desc').setAttribute('content', (s.description || '').substring(0, 160));

    // Update modal sub
    var modalSub = document.getElementById('modal-school-name-sub');
    if (modalSub) modalSub.textContent = s.name + ' — Via LINKEDU Switzerland Specialist';

    var html = '';

    // ── HERO
    var boardingType = s.boarding ? 'Boarding' : 'Day School';
    if (s.boarding && s.school_type && s.school_type.toLowerCase().includes('day')) boardingType = 'Boarding & Day';

    var currArr = Array.isArray(s.curriculum) ? s.curriculum : (s.curriculum ? [s.curriculum] : []);
    var currShort = currArr.slice(0, 2).join(' · ') || 'International';
    var location = [s.city, s.country].filter(Boolean).join(', ');
    var region = s.region ? s.region : '';

    // Hero stats
    var heroStats = [];
    if (s.age_min && s.age_max) heroStats.push({ val: s.age_min + '–' + s.age_max, lab: 'Ages' });
    else if (s.age_min) heroStats.push({ val: s.age_min + '+', lab: 'From Age' });
    if (s.student_count) heroStats.push({ val: s.student_count.toLocaleString(), lab: 'Students' });
    if (s.nationalities_count) heroStats.push({ val: s.nationalities_count + '<span>+</span>', lab: 'Nationalities' });
    if (s.founded_year) heroStats.push({ val: s.founded_year, lab: 'Founded' });
    if (s.fees_usd_min) heroStats.push({ val: '$' + Math.round(s.fees_usd_min / 1000) + 'K', lab: 'From (USD / yr)' });

    html += '<section class="mag-hero" id="hero">';
    html += '<div class="mag-hero-bg"></div><div class="mag-hero-pattern"></div><div class="mag-hero-accent"></div>';
    html += '<div class="mag-hero-content">';
    html += '<div class="mag-hero-breadcrumb">';
    html += '<a href="studyinswitzerland.html"><span class="lang-th">สวิตเซอร์แลนด์</span><span class="lang-en">Switzerland</span></a>';
    html += '<span>›</span><a href="switzerland-schools.html"><span class="lang-th">โรงเรียน</span><span class="lang-en">Schools</span></a>';
    html += '<span>›</span><span style="color:rgba(245,240,232,0.55);">' + esc(s.name) + '</span>';
    html += '</div>';
    html += '<div class="mag-hero-overline">' + esc(region || s.country) + '</div>';
    html += '<h1 class="mag-hero-title">' + esc(s.name) + '</h1>';
    html += '<div class="mag-hero-type-badges">';
    html += '<span class="mag-badge mag-badge-gold">' + boardingType + '</span>';
    if (currShort) html += '<span class="mag-badge mag-badge-outline">' + esc(currShort) + '</span>';
    if (s.scholarship_available) html += '<span class="mag-badge mag-badge-outline">Scholarships Available</span>';
    html += '</div>';
    if (heroStats.length > 0) {
      html += '<div class="mag-hero-stats">';
      heroStats.forEach(function(st) {
        html += '<div class="mag-hero-stat">';
        html += '<div class="mag-hero-stat-val">' + st.val + '</div>';
        html += '<div class="mag-hero-stat-lab">' + st.lab + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>'; // mag-hero-content
    html += '<div class="mag-hero-scroll"><div class="mag-hero-scroll-line"></div>SCROLL</div>';
    html += '</section>';

    // ── FACTS STRIP
    var facts = [];
    if (s.city) facts.push({ val: s.city, lab: 'Location' });
    if (s.region) facts.push({ val: s.region, lab: 'Region' });
    var typeLabel = s.boarding ? (s.school_type && s.school_type.toLowerCase().includes('day') ? 'Boarding & Day' : 'Boarding') : 'Day School';
    facts.push({ val: typeLabel, lab: 'School Type' });
    if (currArr.length > 0) facts.push({ val: currArr[0], lab: 'Primary Curriculum' });
    var langArr = Array.isArray(s.languages) ? s.languages : (s.languages ? [s.languages] : []);
    if (langArr.length > 0) facts.push({ val: langArr.join(' · '), lab: 'Languages' });
    if (s.age_min && s.age_max) facts.push({ val: s.age_min + '–' + s.age_max, lab: 'Age Range' });

    if (facts.length > 0) {
      html += '<div class="facts-strip">';
      html += '<div class="mag-container"><div class="facts-strip-grid">';
      facts.forEach(function(f) {
        var valClass = f.val.length > 12 ? 'fact-val-small' : 'fact-val';
        html += '<div class="fact-item">';
        html += '<div class="' + valClass + '">' + esc(f.val) + '</div>';
        html += '<div class="fact-lab">' + f.lab + '</div>';
        html += '</div>';
      });
      html += '</div></div></div>';
    }

    // ── OPENING NARRATIVE
    if (s.description) {
      html += '<section class="mag-section mag-opening">';
      html += '<div class="mag-container-narrow">';
      html += '<div class="section-label">About the School</div>';
      html += '<p class="mag-opening-lead">' + esc(firstSentence(s.description)) + '</p>';
      var rest = s.description.replace(firstSentence(s.description), '').trim();
      if (rest) html += '<p class="mag-body-text">' + esc(rest) + '</p>';
      // Pull quote from school name
      html += '<div class="pull-quote">';
      html += '<p class="pull-quote-text">"' + esc(s.name) + ' offers an education rooted in excellence — combining rigorous academics with the unmatched setting of the Swiss Alps."</p>';
      html += '</div>';
      html += '</div></section>';
    }

    // ── ACADEMICS
    html += '<section class="mag-section mag-academic">';
    html += '<div class="mag-container"><div class="academic-grid">';

    // Left: curriculum
    html += '<div>';
    html += '<div class="section-label">Academics</div>';
    html += '<h2 class="mag-section-heading">Curriculum &<em> Qualifications</em></h2>';
    if (currArr.length > 0) {
      html += '<ul class="curriculum-list">';
      currArr.forEach(function(c) {
        html += '<li>' + esc(c) + '</li>';
      });
      html += '</ul>';
    }
    // Qualifications parsed from description
    var quals = extractQuals(s.description || '');
    if (quals.length > 0) {
      html += '<div style="margin-top:24px;"><div class="section-label" style="margin-bottom:12px;">Leaving Qualifications</div>';
      html += '<div class="qual-pills">';
      quals.forEach(function(q, i) {
        html += '<span class="qual-pill' + (i === 0 ? ' qual-pill-gold' : '') + '">' + esc(q) + '</span>';
      });
      html += '</div></div>';
    }
    html += '</div>';

    // Right: languages + ages + university placement
    html += '<div>';
    html += '<div class="section-label">Languages of Instruction</div>';
    if (langArr.length > 0) {
      html += '<div class="lang-list">';
      langArr.forEach(function(l) { html += '<span class="lang-tag">' + esc(l) + '</span>'; });
      html += '</div>';
    } else {
      html += '<p class="mag-body-text">Language information available on request.</p>';
    }
    html += '<div style="margin-top:32px;"><div class="section-label">Student Age Range</div>';
    if (s.age_min && s.age_max) {
      html += '<div class="age-range-display">';
      html += '<div class="age-range-num">' + s.age_min + '</div>';
      html += '<div class="age-range-sep">–</div>';
      html += '<div class="age-range-num">' + s.age_max + '</div>';
      html += '<div class="age-range-label" style="margin-left:10px;">years old</div>';
      html += '</div>';
    } else {
      html += '<p class="mag-body-text">Age range available on request.</p>';
    }
    html += '</div>';
    if (s.accreditations) {
      html += '<div style="margin-top:32px;"><div class="section-label">Accreditations</div>';
      html += '<p class="mag-body-text">' + esc(Array.isArray(s.accreditations) ? s.accreditations.join(', ') : s.accreditations) + '</p></div>';
    }
    if (s.university_placement_rate) {
      html += '<div style="margin-top:32px;"><div class="section-label">University Placement</div>';
      html += '<p class="mag-body-text">' + esc(s.university_placement_rate) + '</p></div>';
    }
    if (s.top_universities) {
      html += '<div style="margin-top:32px;"><div class="section-label">Recent University Destinations</div>';
      html += '<p class="mag-body-text">' + esc(Array.isArray(s.top_universities) ? s.top_universities.join(', ') : s.top_universities) + '</p></div>';
    }
    html += '</div>';
    html += '</div></div></section>'; // academic-grid, mag-container, mag-section

    // ── FEES
    html += '<section class="mag-section mag-fees">';
    html += '<div class="mag-container"><div class="fees-grid">';
    html += '<div>';
    html += '<div class="section-label section-label-light">Fees &amp; Costs</div>';
    if (s.fees_usd_min) {
      html += '<div class="fees-main-num">$' + Number(s.fees_usd_min).toLocaleString();
      if (s.fees_usd_max && s.fees_usd_max !== s.fees_usd_min) html += ' – $' + Number(s.fees_usd_max).toLocaleString();
      html += '<span style="font-family:\'Inter\',sans-serif;font-size:0.85rem;color:rgba(245,240,232,0.35);margin-left:8px;">/ year</span></div>';
      html += '<div class="fees-thb">&#x2248; &#x0E3F;' + Math.round(s.fees_usd_min * 35).toLocaleString();
      if (s.fees_usd_max && s.fees_usd_max !== s.fees_usd_min) html += ' – &#x0E3F;' + Math.round(s.fees_usd_max * 35).toLocaleString();
      html += ' / ปี</div>';
      if (s.fees_original) {
        html += '<div class="fees-note">Original fees: ' + esc(s.fees_original) + (s.fees_currency ? ' (' + s.fees_currency + ')' : '') + '<br>USD rates are indicative. Contact school for current figures.</div>';
      }
      html += '<div class="fees-breakdown">';
      html += '<div class="fees-row"><span class="fees-row-label">Annual fees (USD)</span><span class="fees-row-val">$' + Number(s.fees_usd_min).toLocaleString() + (s.fees_usd_max && s.fees_usd_max !== s.fees_usd_min ? ' – $' + Number(s.fees_usd_max).toLocaleString() : '') + '</span></div>';
      html += '<div class="fees-row"><span class="fees-row-label">Approx. in Thai Baht</span><span class="fees-row-val">&#x0E3F;' + Math.round(s.fees_usd_min * 35).toLocaleString() + ' / year</span></div>';
      if (s.fees_original) {
        html += '<div class="fees-row"><span class="fees-row-label">Original (local currency)</span><span class="fees-row-val">' + esc(s.fees_original) + '</span></div>';
      }
      html += '</div>';
    } else {
      html += '<h2 class="mag-section-heading-light" style="font-size:1.5rem;">Fees on Request</h2>';
      html += '<p class="mag-body-text-light">Contact LINKEDU for a personalised fee breakdown and scholarship information for this school.</p>';
    }
    html += '</div>';

    // Right: includes + contact note
    html += '<div>';
    if (s.fees_includes_boarding !== null) {
      html += '<div class="fees-includes-box">';
      html += '<div class="fees-includes-title">What\'s Included</div>';
      html += '<ul class="fees-includes-list">';
      if (s.fees_includes_boarding) {
        html += '<li>Full boarding &amp; accommodation</li>';
        html += '<li>Meals &amp; catering</li>';
      }
      html += '<li>Academic tuition</li>';
      html += '<li>Use of school facilities</li>';
      html += '</ul></div>';
    } else if (s.boarding) {
      html += '<div class="fees-includes-box">';
      html += '<div class="fees-includes-title">Boarding School</div>';
      html += '<ul class="fees-includes-list">';
      html += '<li>Full boarding accommodation available</li>';
      html += '<li>Contact school for exact fee structure</li>';
      html += '<li>Scholarships may be available</li>';
      html += '</ul></div>';
    }
    html += '<div class="fees-contact-note">';
    html += '<p><strong>Thai families:</strong> LINKEDU provides full fee guidance including currency conversion, payment schedules, and scholarship matching — at no charge to families.</p>';
    html += '</div>';
    if (s.scholarship_available) {
      html += '<div style="margin-top:20px;padding:16px 20px;background:rgba(184,150,46,0.12);border:1px solid rgba(184,150,46,0.25);border-radius:4px;">';
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#B8962E;margin-bottom:6px;">Scholarships Available</div>';
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:0.83rem;color:rgba(245,240,232,0.6);line-height:1.55;">This school offers merit or financial scholarships. Ask LINKEDU for details.</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '</div></div></section>'; // fees-grid, mag-container, mag-section

    // ── BOARDING (only if boarding school)
    if (s.boarding) {
      html += '<section class="mag-section mag-boarding">';
      html += '<div class="mag-container"><div class="boarding-grid">';
      html += '<div>';
      html += '<div class="section-label">Boarding Life</div>';
      html += '<h2 class="mag-section-heading">Life at the <em>School</em></h2>';
      html += '<p class="mag-body-text">As a boarding school, ' + esc(s.name) + ' provides a complete residential education — students live, study, and grow together in a close-knit community.</p>';
      html += '<ul class="boarding-list">';
      html += '<li>Full boarding accommodation on campus</li>';
      if (s.boarding_capacity) html += '<li>Boarding capacity: ' + s.boarding_capacity + ' students</li>';
      if (s.single_rooms) html += '<li>Single rooms: ' + s.single_rooms + '</li>';
      if (s.house_system) html += '<li>' + esc(s.house_system) + '</li>';
      if (s.boarding_arrangements) html += '<li>' + esc(s.boarding_arrangements) + '</li>';
      if (s.boarding_facilities) html += '<li>' + esc(s.boarding_facilities) + '</li>';
      if (s.food_options) html += '<li>' + esc(s.food_options) + '</li>';
      html += '<li>Located in ' + esc(location) + (region ? ' (' + esc(region) + ')' : '') + '</li>';
      html += '</ul></div>';
      html += '<div>';
      html += '<div class="boarding-highlight">';
      html += '<div class="boarding-highlight-label">Setting</div>';
      html += '<p class="boarding-highlight-text">' + esc(s.name) + ' is situated in ' + esc(location) + (region ? ', ' + esc(region) : '') + ' — offering students an extraordinary environment for learning, sport, and personal development.</p>';
      html += '</div>';
      if (s.extracurriculars || s.sports_facilities || s.arts_programs || s.clubs) {
        html += '<div style="margin-top:24px;"><div class="section-label">Activities &amp; Facilities</div>';
        var activities = [];
        if (s.extracurriculars) activities = activities.concat(Array.isArray(s.extracurriculars) ? s.extracurriculars : [s.extracurriculars]);
        if (s.sports_facilities) activities = activities.concat(Array.isArray(s.sports_facilities) ? s.sports_facilities : [s.sports_facilities]);
        if (s.arts_programs) activities = activities.concat(Array.isArray(s.arts_programs) ? s.arts_programs : [s.arts_programs]);
        if (s.clubs) activities = activities.concat(Array.isArray(s.clubs) ? s.clubs : [s.clubs]);
        html += '<div class="qual-pills">';
        activities.slice(0, 12).forEach(function(a) { html += '<span class="qual-pill">' + esc(a) + '</span>'; });
        html += '</div></div>';
      }
      html += '</div>';
      html += '</div></div></section>';
    }

    // ── ADMISSIONS
    html += '<section class="mag-section mag-admissions">';
    html += '<div class="mag-container">';
    html += '<div class="section-label section-label-light">Admissions</div>';

  function showError(title, msg) {
    document.getElementById('page-content').innerHTML =
      '<div class="page-error"><h2>' + title + '</h2><p>' + msg + '</p></div>';
  }

  // ══════════════════════════════════════════════
  //  HELPERS
  // ══════════════════════════════════════════════
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function firstSentence(text) {
    if (!text) return '';
    var m = text.match(/^[^.!?]*[.!?]/);
    return m ? m[0] : text.substring(0, 140) + '…';
  }

  function extractQuals(desc) {
    var quals = [];
    var checks = [
      { pattern: /IB Diploma/i, label: 'IB Diploma' },
      { pattern: /IGCSE/i, label: 'IGCSE' },
      { pattern: /Swiss Maturit[eé]/i, label: 'Swiss Maturité' },
      { pattern: /A-Levels?/i, label: 'A-Levels' },
      { pattern: /AP\b/i, label: 'AP' },
      { pattern: /Swiss Federal Maturity/i, label: 'Swiss Federal Maturity' },
      { pattern: /MYP/i, label: 'IB MYP' },
      { pattern: /PYP/i, label: 'IB PYP' },
    ];
    checks.forEach(function(c) { if (c.pattern.test(desc)) quals.push(c.label); });
    return quals;
  }

  // ══════════════════════════════════════════════
  //  UI
  // ══════════════════════════════════════════════
  function showFloatingBtn() {
    var floatingBtn = document.getElementById('floatingEnquire');
    if (!floatingBtn) return;
    window.addEventListener('scroll', function() {
      var hero = document.getElementById('hero');
      if (!hero) return;
      var heroBottom = hero.getBoundingClientRect().bottom;
      if (heroBottom < 0) floatingBtn.classList.add('visible');
      else floatingBtn.classList.remove('visible');
    });
  }

  function openModal() {
    document.getElementById('enquireModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('enquireModal').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('enquireModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function submitEnquiry(e) {
    e.preventDefault();
    document.getElementById('modal-body').innerHTML =
      '<div class="modal-success"><div class="modal-success-icon">✓</div>' +
      '<h3><span class="lang-th">ได้รับข้อความแล้ว</span><span class="lang-en">Message Received</span></h3>' +
      '<p><span class="lang-th">ทีม LINKEDU จะติดต่อกลับภายใน 24 ชั่วโมง</span><span class="lang-en">The LINKEDU team will respond within 24 hours.</span></p></div>';
    setTimeout(closeModal, 3500);
  }

  function setLang(l) {
    localStorage.setItem('linkedu-lang', l);
    document.documentElement.setAttribute('lang', l);
    document.getElementById('btn-th').classList.toggle('active', l === 'th');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
  }
  function toggleMobile() {
    document.getElementById('mobileNav').classList.toggle('open');
